
name: MerON - Aggiorna video ufficiali

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlla-video:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Verifica il catalogo JSON
        run: python -m json.tool videos.json > /dev/null

      - name: Controlla i video YouTube recenti
        run: python controlla_video.py

      - name: Recupera gli episodi Apple Podcasts
        run: python controlla_episodi.py

      - name: Recupera archivio storico YouTube
        run: python recupera_archivio_youtube.py

      - name: Salva archivio YouTube
        uses: actions/upload-artifact@v4
        with:
          name: meron-archivio-youtube
          path: archivio_youtube.json
          retention-days: 30

      - name: Esegui controllo di sicurezza
        run: python confronta_archivio.py

      - name: Salva controllo video MerON
        uses: actions/upload-artifact@v4
        with:
          name: meron-controllo-video
          path: controllo_video_meron.json
          retention-days: 30

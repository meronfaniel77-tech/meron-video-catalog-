name: MerON - Video automatici giornalieri

on:
  schedule:
    # GitHub Actions usa UTC: 05:23 UTC = 06:23 in inverno / 07:23 in estate (Italia).
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meron-video-pipeline
  cancel-in-progress: false

jobs:
  ricerca-verifica-pubblicazione:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenza YouTube
        run: python -m pip install --upgrade yt-dlp

      - name: Verifica sintassi programmi
        run: |
          python -m py_compile scopri_video_tutti_podcast.py gestisci_video_tutti_podcast.py verifica_meron_automatica.py

      - name: Salva stato iniziale per controllo di sicurezza
        run: python verifica_meron_automatica.py prima

      - name: Scopri i video del lotto successivo
        run: python scopri_video_tutti_podcast.py

      - name: Importa i candidati e applica filtri prudenti
        env:
          MERON_MODALITA: SIMULAZIONE
          MERON_LEGGI_LOTTO: '1'
        run: python gestisci_video_tutti_podcast.py

      - name: Pubblica soltanto i candidati approvati automaticamente
        env:
          MERON_MODALITA: PUBBLICAZIONE
          MERON_LEGGI_LOTTO: '0'
        run: python gestisci_video_tutti_podcast.py

      - name: Blocca qualsiasi modifica non sicura
        run: python verifica_meron_automatica.py dopo

      - name: Salva catalogo, coda e avanzamento su GitHub
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- videos.json coda_video_tutti_podcast.json stato_video_tutti_podcast.json
          if git diff --cached --quiet; then
            echo 'Nessuna modifica persistente da salvare.'
          else
            git commit -m 'MerON: scopri, valida e pubblica automaticamente video sicuri'
            git push origin HEAD:main
          fi
